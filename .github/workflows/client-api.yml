name: Native Client API Security Regression

on:
  push:
    branches: [feat/hysteria2-sspanel]
  pull_request:
    paths:
      - 'src/**'
      - 'app/**'
      - 'db/migrations/**'
      - 'tests/**'
      - 'docs/client-v1*'
      - 'composer.*'
      - '.github/workflows/client-api.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: test-only-client-api-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -ptest-only-client-api-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, fileinfo, pdo_mysql, pdo_sqlite, redis, yaml, bcmath, curl, openssl, posix, pcntl, sodium, zip
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Dependency security audit
        run: composer audit --locked
      - name: SQLite authorization and rollback tests
        run: vendor/bin/phpunit --no-configuration --bootstrap vendor/autoload.php --fail-on-warning --fail-on-risky tests/Integration/Services/Client/ClientApiTest.php
      - name: InnoDB authorization, rollback and concurrent transaction tests
        env:
          CLIENT_TEST_MYSQL: '1'
          CLIENT_TEST_MYSQL_PASSWORD: test-only-client-api-password
        run: vendor/bin/phpunit --no-configuration --bootstrap vendor/autoload.php --fail-on-warning --fail-on-risky tests/Integration/Services/Client/ClientApiTest.php
      - name: Strict project lint
        if: matrix.php == '8.3'
        run: vendor/bin/phpinsights analyse --no-interaction --min-quality=100 --min-complexity=80 --min-architecture=100 --min-style=100
